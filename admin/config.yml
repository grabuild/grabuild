backend:
  name: turbo-github
  turbo_site_id: e8a88777-20ce-4567-91ee-ac81be323bd6

media_folder: "img/uploads"
public_folder: "/img/uploads"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - name: "home"
        label: "Home Page"
        file: "content/home.md"
        fields:
          - label: "SEO Settings"
            name: "seo"
            widget: "object"
            fields:
              - { label: "SEO Title", name: "title", widget: "string" }
              - { label: "Meta Description", name: "description", widget: "text" }
              - { label: "Canonical URL", name: "canonical", widget: "string", required: false }
              - { label: "Focus Keyword", name: "focus_keyword", widget: "string", required: false }
              - { label: "Robots", name: "robots", widget: "select", options: ["index, follow", "noindex, follow", "index, nofollow", "noindex, nofollow"], default: "index, follow" }

          - label: "Homepage Content"
            name: "content"
            widget: "object"
            fields:
              - { label: "Main Heading", name: "heading", widget: "string" }
              - { label: "Short Introduction", name: "intro", widget: "text" }
              - { label: "About Heading", name: "about_heading", widget: "string" }
              - { label: "About Description", name: "about_description", widget: "text" }
